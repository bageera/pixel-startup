name: python-image
# Gate + build + push the python backend image to GHCR on every main push and v* tag.
# After this lands, "push to the repo" produces the image; manual docker push retires.
# (Single-file CI: tests are the push gate — never ship an image from a red tree.)

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: python-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Python gate (pytest, ruff, pyright, pip-audit)
        run: |
          uv sync
          make python-test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Node gate
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bageera/pixel-startup-python
          # main -> latest + main; v1.2.0 -> 1.2.0 + latest (default flavor)
          tags: |
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
